name: Demos

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render demos & screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      # Pinned tool versions instead of "latest" downloads: ttyd, ffmpeg and the
      # fonts come from the runner's signed Ubuntu archive, VHS is built at an
      # exact version verified by the Go checksum database.
      - name: Install VHS and dependencies
        env:
          VHS_VERSION: v0.12.1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ttyd ffmpeg fonts-jetbrains-mono fonts-noto-color-emoji
          go install "github.com/charmbracelet/vhs@${VHS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          ttyd --version
          ffmpeg -version | head -n 1

      - name: Generate demos and screenshots
        run: .github/scripts/generate_demos.sh

      - name: Upload rendered images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-images
          path: |
            docs/images/*.gif
            docs/images/*.png
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Push demos to a review branch
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the automation/demos-* branch (never main)
    # Only first-party actions and git run here. The result goes to a dedicated
    # branch; a maintainer opens the pull request from the link in the job
    # summary, so nothing is ever pushed straight to the default branch.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download rendered images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-images
          path: docs/images

      - name: Commit to automation branch
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git add -- 'docs/images/*.gif' 'docs/images/*.png'
          if git diff --cached --quiet; then
            echo "Demos unchanged; nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          safe_ref="$(printf '%s' "${REF_NAME}" | tr -c 'A-Za-z0-9._-' '-')"
          branch="automation/demos-${safe_ref}-${RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "${branch}"
          git commit -m 'docs: regenerate demos & screenshots'
          git push origin "HEAD:refs/heads/${branch}"
          {
            echo "Demos pushed to \`${branch}\`."
            echo ""
            echo "Open a pull request: https://github.com/${REPO}/compare/${DEFAULT_BRANCH}...${branch}?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
