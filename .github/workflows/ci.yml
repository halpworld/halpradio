name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published Go or module vulnerability fails CI even
    # when nobody pushes.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    # The macOS job can run on the maintainer's self-hosted Mac (an ephemeral
    # Tart VM, see docs/SELF_HOSTED_MAC_RUNNER.md) when the repository
    # variable MACOS_SELF_HOSTED is 'true', except for pull requests from forks
    # or Dependabot. This only avoids routing them there by accident: a fork
    # pull request can edit this file, so the repository setting "Require
    # approval for all external contributors" is what keeps fork code off that
    # machine. Unset the variable to fall back to GitHub-hosted runners.
    runs-on: >-
      ${{
        (matrix.os == 'macos-latest'
          && vars.MACOS_SELF_HOSTED == 'true'
          && (github.event_name != 'pull_request'
            || (github.event.pull_request.head.repo.full_name == github.repository
              && github.event.pull_request.user.login != 'dependabot[bot]')))
        && fromJSON('["self-hosted","macOS","ARM64","halpradio-mac"]')
        || matrix.os
      }}
    permissions:
      contents: read
      pull-requests: write # coverage comment only
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Check code formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not properly formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests with race detector and coverage
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Compute coverage delta & publish motivational report
        if: runner.os == 'Linux' && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          chmod +x .github/scripts/coverage_report.sh
          ./.github/scripts/coverage_report.sh

  supply-chain:
    name: Modules, vulnerabilities & Docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Verify module graph is tidy and untampered
        run: |
          go mod tidy -diff
          go mod verify

      - name: govulncheck (with the toolchain releases are built with)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build container image
        run: docker build --pull -t halpradio:ci .

  cross-compile:
    name: Cross Compile Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify macOS ARM64 build
        env:
          CGO_ENABLED: "0"
          GOOS: "darwin"
          GOARCH: "arm64"
        run: go build -o /dev/null main.go

      - name: Verify macOS AMD64 build
        env:
          CGO_ENABLED: "0"
          GOOS: "darwin"
          GOARCH: "amd64"
        run: go build -o /dev/null main.go

      - name: Verify Linux AMD64 build
        env:
          CGO_ENABLED: "0"
          GOOS: "linux"
          GOARCH: "amd64"
        run: go build -o /dev/null main.go

      - name: Verify Linux ARM64 build
        env:
          CGO_ENABLED: "0"
          GOOS: "linux"
          GOARCH: "arm64"
        run: go build -o /dev/null main.go

      - name: Verify Windows AMD64 build
        env:
          CGO_ENABLED: "0"
          GOOS: "windows"
          GOARCH: "amd64"
        run: go build -o /dev/null main.go

      - name: Verify Windows ARM64 build
        env:
          CGO_ENABLED: "0"
          GOOS: "windows"
          GOARCH: "arm64"
        run: go build -o /dev/null main.go
