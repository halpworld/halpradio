name: "🐛 Bug Report"
description: "File an issue for a problem, audio playback failure, or crash in halpradio"
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem in **halpradio**!
        Please verify if the issue persists when running with different audio backends (`halpradio -backend mpv` vs `halpradio -backend native`).

        **Please attach a debug log.** Re-run with `halpradio --debug`, reproduce the problem, quit, and attach
        `~/.config/halpradio/debug.log`. If the UI freezes and you cannot quit, wait ~10 seconds before killing
        halpradio (`Ctrl+C`, or `pkill halpradio` from another terminal) — the built-in watchdog writes a
        goroutine dump to the log that usually pinpoints the cause on its own.
  - type: input
    id: version
    attributes:
      label: "halpradio Version"
      description: "Output of `halpradio -version` or git commit hash."
      placeholder: "e.g., v0.0.5 or git-commit-hash"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      description: "What OS and architecture are you running?"
      options:
        - "macOS (Apple Silicon / ARM64)"
        - "macOS (Intel x86_64)"
        - "Linux (x86_64)"
        - "Linux (ARM64 / Raspberry Pi)"
        - "Windows / WSL"
        - "Other"
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: "Audio Backend"
      description: "Which audio playback backend was active when the issue occurred?"
      options:
        - "mpv"
        - "vlc / cvlc"
        - "ffplay"
        - "native (oto/v3 Go engine)"
        - "mplayer / mpg123"
        - "Auto-detected (not specified)"
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: "Terminal Emulator"
      description: "What terminal emulator are you using?"
      placeholder: "e.g., Ghostty, Kitty, iTerm2, Alacritty, WezTerm, Windows Terminal"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "Describe what went wrong..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Steps to reproduce the behavior."
      value: |
        1. Run 'halpradio'
        2. Navigate to station '...'
        3. Press '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs or Terminal Output"
      description: "Paste any relevant terminal error logs or stack traces."
      render: shell
    validations:
      required: false
  - type: textarea
    id: debug_log
    attributes:
      label: "Debug Log"
      description: |
        Contents of `~/.config/halpradio/debug.log` after reproducing with `halpradio --debug`
        (or attach the file). This is by far the most useful thing you can include.
      render: shell
    validations:
      required: false
