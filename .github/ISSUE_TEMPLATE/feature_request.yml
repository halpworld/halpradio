name: "💡 Feature Request"
description: "Suggest an idea, new visualizer, new UI theme, or feature improvement for halpradio"
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make **halpradio** even better? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: "Is your feature request related to a problem?"
      description: "A clear description of what the problem or limitation is (e.g. 'I'm always frustrated when...')."
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: "Describe the Solution You'd Like"
      description: "A clear and concise description of what you want to happen."
      placeholder: "e.g. Add an audio recording shortcut, support custom m3u playlists, new theme..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Describe Alternatives You've Considered"
      description: "Any alternative solutions or features you've considered."
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "Additional Context or Mockups"
      description: "Add any other context, screenshots, or design thoughts here."
    validations:
      required: false
