version: 2

project_name: halpradio

before:
  hooks:
    # Never rewrite go.mod/go.sum during a release: fail if the module graph
    # has drifted from what is committed, or if a cached module was altered.
    - go mod tidy -diff
    - go mod verify

builds:
  - id: halpradio
    main: ./main.go
    binary: halpradio
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # Reproducible builds: no local paths in the binary and file times taken
    # from the tagged commit rather than the build machine's clock.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/halpworld/halpradio/pkg/app.Version={{.Version}}

universal_binaries:
  - id: halpradio
    replace: false
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - stations.yaml

checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: ./install.sh

# Keyless (Sigstore) signature over checksums.txt. The bundle binds the file to
# this repository's release workflow at the release tag; see SECURITY.md for
# the verification command. Requires cosign on PATH and `id-token: write`.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

# SPDX SBOM for every archive (requires syft on PATH).
sboms:
  - artifacts: archive

nfpms:
  - id: halpradio-debs
    package_name: halpradio
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: halpworld
    homepage: "https://github.com/halpworld/halpradio"
    maintainer: "halpworld <https://github.com/halpworld>"
    description: "LazyVim-inspired Terminal Internet Radio Streamer"
    license: "GPL-3.0-or-later"
    section: sound
    priority: optional
    formats:
      - deb
    dependencies:
      - ca-certificates
    recommends:
      - mpv
    suggests:
      - vlc
    contents:
      - src: stations.yaml
        dst: /usr/share/halpradio/stations.yaml
      - src: LICENSE
        dst: /usr/share/doc/halpradio/copyright
      - src: README.md
        dst: /usr/share/doc/halpradio/README.md

brews:
  - name: halpradio
    repository:
      owner: halpworld
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    skip_upload: auto
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    homepage: "https://github.com/halpworld/halpradio"
    description: "LazyVim-inspired Terminal Internet Radio Streamer"
    license: "GPL-3.0-or-later"
    install: |
      bin.install "halpradio"
    test: |
      assert_match "halpradio", shell_output("#{bin}/halpradio -version")

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # Never overwrite assets of a published release.
  replace_existing_artifacts: false
  extra_files:
    - glob: ./install.sh
