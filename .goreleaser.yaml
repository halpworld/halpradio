version: 2

project_name: halpradio

before:
  hooks:
    - go mod tidy

builds:
  - id: halpradio
    main: ./main.go
    binary: halpradio
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/halpworld/halpradio/pkg/app.Version={{.Version}}

universal_binaries:
  - id: halpradio
    replace: false

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - stations.yaml

checksum:
  name_template: "checksums.txt"

nfpms:
  - id: halpradio-debs
    package_name: halpradio
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: halpworld
    homepage: "https://github.com/halpworld/halpradio"
    maintainer: "halpworld <https://github.com/halpworld>"
    description: "LazyVim-inspired Terminal Internet Radio Streamer"
    license: "GPL-3.0-or-later"
    section: sound
    priority: optional
    formats:
      - deb
    dependencies:
      - ca-certificates
    recommends:
      - mpv
    suggests:
      - vlc
    contents:
      - src: stations.yaml
        dst: /usr/share/halpradio/stations.yaml
      - src: LICENSE
        dst: /usr/share/doc/halpradio/copyright
      - src: README.md
        dst: /usr/share/doc/halpradio/README.md

brews:
  - name: halpradio
    repository:
      owner: halpworld
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    skip_upload: auto
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    homepage: "https://github.com/halpworld/halpradio"
    description: "LazyVim-inspired Terminal Internet Radio Streamer"
    license: "GPL-3.0-or-later"
    install: |
      bin.install "halpradio"
    test: |
      assert_match "halpradio", shell_output("#{bin}/halpradio -version")

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  replace_existing_artifacts: true
